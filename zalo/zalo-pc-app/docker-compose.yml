# Zalo PC app — chạy bằng image dựng sẵn trên GHCR (không cần build, không cài thêm gì).
#
#   1) (Không bắt buộc) tạo file .env cạnh file này — xem .env.example. KHÔNG có .env thì vẫn chạy: app tự sinh tài khoản,
#      in một lần trong log và lưu ở /data/THONG-TIN-DANG-NHAP.txt; mật khẩu/webhook... đặt tiếp trong WebUI.
#   2) docker compose up -d
#   3) Cập nhật bản mới:              docker compose pull && docker compose up -d
#      (hoặc để Watchtower tự kéo :latest; muốn ghim phiên bản thì đổi :latest thành :vX.Y.Z)
#
# Image đã có sẵn ffmpeg (libx264), libopus, OpenSSL — build sẽ thất bại nếu thiếu
# (python3 -m zalo_pc_app.deps). Kiểm tra bản đang chạy: GET /api/status -> version, deps.
services:
  zalo-pc:
    image: ghcr.io/tritue2011/zalo-calling:latest
    container_name: zalo-calling
    ports:
      # Chỉ mở loopback; truy cập từ xa qua reverse proxy / ingress của bạn.
      # Đổi thành "8080:8080" nếu HA ở máy khác cần gọi trực tiếp trong LAN.
      - "127.0.0.1:8080:8080"
    volumes:
      # Tên volume (mặc định) hoặc đường dẫn máy chủ (vd /opt/zalo:/data): entrypoint tự chown
      # thư mục dữ liệu cho user app rồi hạ quyền — không cần chown tay.
      - zalo-pc-data:/data
    environment:
      # TÙY CHỌN (không còn bắt buộc): để trống = app TỰ SINH tài khoản lần đầu (xem docker-entrypoint.py). Dạng `${BIEN:-}` nên thiếu biến
      # trong .env KHÔNG làm `docker compose up` báo lỗi. KHÔNG ghi mật khẩu thật vào file này (đặt trong .env hoặc biến môi trường stack).
      ZALO_PC_APP_USER: "${ZALO_PC_APP_USER:-}"
      ZALO_PC_APP_PASSWORD: "${ZALO_PC_APP_PASSWORD:-}"
      # Thay cho PASSWORD: hash tính sẵn (python3 -m zalo_pc_app.app_auth).
      # ZALO_PC_APP_PASSWORD_HASH: "${ZALO_PC_APP_PASSWORD_HASH:-}"
      # Webhook ban đầu (chỉ khi CHƯA có cấu hình; WebUI/HA đã đặt thì không bị đè). Một địa chỉ cho cả bốn loại:
      ZALO_PC_WEBHOOK_URL: "${ZALO_PC_WEBHOOK_URL:-}"
      # ZALO_PC_APP_SESSION_HOURS: "8"
      ZALO_PC_HOST: "0.0.0.0"
      ZALO_PC_PORT: "8080"
      # Bật vết lỗi khi tiến trình bị abort (libopus/ffmpeg): in ngăn xếp của mọi luồng.
      PYTHONFAULTHANDLER: "1"
    # Cuộc gọi dùng cổng UDP tạm thời đi RA tới relay Zalo: không cần mở/ánh xạ cổng UDP nào.
    restart: unless-stopped
    init: true                # dọn ffmpeg mồ côi, không để lại tiến trình ma
    mem_limit: 512m           # đo: ~70 MB lúc rảnh, mỗi ffmpeg video ≤ ~160 MB; tăng nếu camera 4K
    memswap_limit: 512m       # không tràn sang swap
    cpus: "1.5"
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    labels:
      # Watchtower (nếu dùng) tự kéo bản :latest mới.
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  zalo-pc-data:
