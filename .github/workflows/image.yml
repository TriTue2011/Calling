# Dựng image app Zalo (đa kiến trúc) lên GHCR khi đẩy tag vX: test app -> :vX, :X (không chữ v — Supervisor của
# add-on kéo thẻ này) và :latest.
# Tách khỏi release.yml: bản tích hợp HA ra ngay, image dựng song song.
# Cập nhật máy chủ: Watchtower kéo :latest, hoặc `docker compose pull && docker compose up -d`.
name: Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag cần dựng image (đã tồn tại), ví dụ v2026.11.10.5'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          for i in 1 2 3; do sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libopus0 && break; sleep 10; done
          cd zalo/zalo-pc-app && python3 -m zalo_pc_app.deps && python3 tests/ci_runner.py

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./zalo/zalo-pc-app
          file: ./zalo/zalo-pc-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.test.outputs.tag }}
          tags: |
            ghcr.io/tritue2011/zalo-calling:${{ needs.test.outputs.tag }}
            ghcr.io/tritue2011/zalo-calling:${{ needs.test.outputs.version }}
            ghcr.io/tritue2011/zalo-calling:latest
