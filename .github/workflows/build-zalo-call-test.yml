# Build tự động image TEST cho Zalo call client.
# File này phải nằm tại .github/workflows/ ở GỐC repo chứa code (repo Calling).
# Image build xong tự đẩy lên GHCR, không cần build tay.
# Trigger: push lên main hoặc bất kỳ nhánh muse/* nào + chạy tay (workflow_dispatch),
# nên push nhánh muse/calling-test cũng tự build ngay, không cần chờ gộp main.
name: Build zalo-call-test image

on:
  push:
    branches: [main, 'muse/*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./zalo-call-client
          file: ./zalo-call-client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tritue2011/zalo-call-test:test
            ghcr.io/tritue2011/zalo-call-test:test-${{ github.sha }}
