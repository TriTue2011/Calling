# Phát hành tích hợp HA (nhẹ, vài chục giây): đẩy tag vX (ví dụ v2026.11.10.5) -> kiểm tag khớp
# version trong manifest -> tạo GitHub Release kèm gói zalo_call.zip để HACS nhận bản mới.
# KHÔNG dựng image ở đây: image có workflow riêng (image.yml), chạy song song và có hỏng cũng
# không chặn bản tích hợp. Test chạy ở ci.yml trên mỗi lần đẩy lên main.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag phát hành (đã tồn tại), ví dụ v2026.11.10.5'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: t
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}
      - name: Tag phải khớp version trong manifest
        run: |
          V=$(python3 -c "import json;print(json.load(open('custom_components/zalo_call/manifest.json'))['version'])")
          test "$V" = "${{ steps.t.outputs.version }}" || { echo "manifest=$V khác tag=${{ steps.t.outputs.version }}"; exit 1; }
      - name: Phiên bản add-on phải khớp tag (Supervisor kéo ghcr.io/tritue2011/zalo-calling:<version>[-noui])
        run: |
          python3 - <<'PY'
          import re
          v = "${{ steps.t.outputs.version }}"
          for path, want in (("zalo_calling/config.yaml", v), ("zalo_calling_noui/config.yaml", v + "-noui")):
              got = re.search(r'^version:\s*"([^"]+)"', open(path, encoding="utf-8").read(), re.M).group(1)
              assert got == want, "%s: version=%s, cần %s" % (path, got, want)
          PY
      - name: Gói tích hợp HA
        run: |
          cd custom_components/zalo_call
          zip -r ../../zalo_call.zip . -x '__pycache__/*' '*.pyc'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          generate_release_notes: true
          files: |
            zalo_call.zip
            zalo/zalo-pc-app/docker-compose.yml
          body: |
            **Tích hợp HA**: cập nhật bằng HACS, hoặc giải nén `zalo_call.zip` vào `custom_components/zalo_call`.
            **Image app**: `ghcr.io/tritue2011/zalo-calling:${{ steps.t.outputs.tag }}` (và `:latest`) do workflow «Image» dựng riêng, có thể ra sau vài phút.
            Cập nhật máy chủ: `docker compose pull && docker compose up -d` (hoặc để Watchtower tự kéo `:latest`).
