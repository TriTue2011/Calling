# Phát hành: đẩy tag vX (ví dụ v2026.11.10.1) -> test, dựng image đa kiến trúc lên GHCR
# (:vX và :latest), rồi tạo GitHub Release kèm gói tích hợp HA (zalo_call.zip).
# Cập nhật trên máy chủ: Watchtower kéo :latest, hoặc `docker compose pull && docker compose up -d`;
# cập nhật tích hợp HA bằng HACS (nhận release mới).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag phát hành (đã tồn tại), ví dụ v2026.11.10.1'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag phải khớp version trong manifest
        run: |
          V=$(python3 -c "import json;print(json.load(open('custom_components/zalo_call/manifest.json'))['version'])")
          test "$V" = "${{ steps.t.outputs.version }}" || { echo "manifest=$V khác tag=${{ steps.t.outputs.version }}"; exit 1; }
      - run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libopus0
          cd zalo/zalo-pc-app && python3 -m zalo_pc_app.deps && python3 tests/ci_runner.py

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./zalo/zalo-pc-app
          file: ./zalo/zalo-pc-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.check.outputs.tag }}
          tags: |
            ghcr.io/tritue2011/zalo-calling:${{ needs.check.outputs.tag }}
            ghcr.io/tritue2011/zalo-calling:latest

  release:
    needs: [check, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
      - name: Gói tích hợp HA
        run: |
          cd custom_components/zalo_call
          zip -r ../../zalo_call.zip . -x '__pycache__/*' '*.pyc'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          files: |
            zalo_call.zip
            zalo/zalo-pc-app/docker-compose.yml
          body: |
            **Image**: `ghcr.io/tritue2011/zalo-calling:${{ needs.check.outputs.tag }}` (và `:latest`)
            **Tích hợp HA**: cập nhật bằng HACS, hoặc giải nén `zalo_call.zip` vào `custom_components/zalo_call`.
            Cập nhật máy chủ: `docker compose pull && docker compose up -d` (hoặc để Watchtower tự kéo `:latest`).
