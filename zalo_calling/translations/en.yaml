configuration:
  username:
    name: Username
    description: App username (default admin). Not needed when opened from the HA side panel; used for port 8080 and the Zalo Call integration.
  password:
    name: Password
    description: Leave empty and the app generates one, prints it once in the log and keeps it in /data/THONG-TIN-DANG-NHAP.txt. A password changed later in the WebUI or via zalo_call.set_app_password is kept.
  webhook_url:
    name: Initial webhook URL
    description: Where the app posts messages, group events, reactions and calls (one URL for all four). Used only when no webhook is configured yet. Leave empty when using the Zalo Call integration.
network:
  8080/tcp: The Zalo Call integration and in-home speakers/cameras connect here; keep 8080 unless it clashes.
