# Add-on Zalo Calling — BẢN CÓ GIAO DIỆN (WebUI hiện ngay trong bảng bên của Home Assistant, không cần mở cổng).
# Cấu hình: ba tuỳ chọn dưới đây (đều không bắt buộc) hoặc làm hết trong WebUI. Giá trị ở đây là KHỞI ĐẦU:
# mật khẩu đổi trong WebUI/dịch vụ HA thì được giữ, không bị tuỳ chọn này ghi đè.
# version phải khớp custom_components/zalo_call/manifest.json (tests/test_addon_packaging.py kiểm); Supervisor kéo
# ghcr.io/tritue2011/zalo-calling:<version>.
name: "Zalo Calling"
description: "Gọi thoại/video Zalo từ Home Assistant — có WebUI ngay trong bảng bên"
version: "2026.11.14.1"
slug: "zalo_calling"
url: "https://github.com/TriTue2011/Zalo-calling"
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: "mdi:phone-in-talk"
panel_title: "Zalo Calling"
panel_admin: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Tích hợp Zalo Call và loa/camera trong nhà gọi vào cổng này; để nguyên 8080 là chạy được ngay"
# Supervisor tự khởi động lại add-on khi đường này thôi trả lời (đường công khai, không lộ gì).
watchdog: "http://[HOST]:[PORT:8080]/api/app/status"
options:
  username: "admin"
  password: ""
  webhook_url: ""
schema:
  username: "str?"
  # Bỏ trống: app tự sinh mật khẩu, in một lần trong nhật ký và lưu /data/THONG-TIN-DANG-NHAP.txt.
  # Mở bằng bảng bên của HA thì KHÔNG cần mật khẩu (HA đã xác thực); mật khẩu chỉ dùng khi vào qua cổng 8080 và cho tích hợp.
  password: "password?"
  webhook_url: "url?"
image: "ghcr.io/tritue2011/zalo-calling"
