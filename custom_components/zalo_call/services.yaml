# SINH TU DONG bang zalo-pc-app/tools/gen_ha_catalog.py — dung sua tay.
send_message:
  name: send_message
  description: Gửi tin nhắn Zalo
  fields:
    entry_id: &id001
      name: Tài khoản Zalo Call
      description: Chọn tài khoản khi có nhiều tích hợp Zalo Call (bỏ trống = tài khoản đầu tiên).
      required: false
      selector:
        config_entry:
          integration: zalo_call
    thread_id:
      name: Mã hội thoại (threadId)
      description: UserId (1-1) hoặc GroupId (nhóm).
      required: true
      example: '5841349563795164131'
      selector:
        text: null
    type:
      name: Loại hội thoại
      description: user = 1-1, group = nhóm.
      default: user
      selector:
        select:
          options:
          - user
          - group
    message:
      name: Nội dung tin nhắn
      description: Nội dung tin nhắn
      required: true
      selector:
        text: null
      example: Hello từ Home Assistant
send_file:
  name: send_file
