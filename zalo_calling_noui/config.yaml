# Add-on Zalo Calling — BẢN KHÔNG GIAO DIỆN (image :<version>-noui, nhỏ hơn, cho máy cấu hình yếu).
# Không có WebUI nên tên đăng nhập và mật khẩu BẮT BUỘC đặt ở đây (thiếu là Supervisor không cho khởi động).
# Đọc/đổi các cài đặt khác lúc đang chạy bằng dịch vụ HA zalo_call.get_app_settings / set_app_settings /
# set_app_password hoặc curl tới /api/... (xem DOCS.md). Đăng nhập Zalo bằng dịch vụ zalo_call.login_qr.
# version = manifest + "-noui" (tests/test_addon_packaging.py kiểm).
name: "Zalo Calling (không giao diện)"
description: "Gọi thoại/video Zalo từ Home Assistant — bản nhẹ, không WebUI, cấu hình bằng tuỳ chọn add-on"
version: "2026.11.14.1-noui"
slug: "zalo_calling_noui"
url: "https://github.com/TriTue2011/Zalo-calling"
arch:
  - amd64
  - aarch64
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Tích hợp Zalo Call và loa/camera trong nhà gọi vào cổng này; để nguyên 8080 là chạy được ngay"
watchdog: "http://[HOST]:[PORT:8080]/api/app/status"
options:
  username: "admin"
  password: ""
  webhook_url: ""
schema:
  username: "str(1,64)"
  password: "password(8,128)"
  webhook_url: "url?"
image: "ghcr.io/tritue2011/zalo-calling"
