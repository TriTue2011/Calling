services:
  zalo-pc:
    build: .
    image: ghcr.io/tritue2011/zalo-pc-app-test:test
    ports:
      # Bind loopback on the host; put it behind the user's own
      # reverse proxy / HA ingress for remote access.
      - "127.0.0.1:8080:8080"
    volumes:
      - zalo-pc-data:/data
    environment:
      # Optional. Without it, login params go plaintext + signkey,
      # which the server accepts only if param encryption is disabled
      # server-side (see bao-cao.md, open question O2).
      # ZALO_PC_PARAM_CIPHER_KEY: ""
      ZALO_PC_HOST: "0.0.0.0"
      ZALO_PC_PORT: "8080"
    restart: unless-stopped

volumes:
  zalo-pc-data:
